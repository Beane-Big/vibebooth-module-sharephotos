server {
    listen 80;
    root /usr/share/nginx/html;

    # 单页应用：/apps/sharephotos/ 下的其他路径都返回 index.html。
    # index.html 每次都向服务器确认是否有新版本，升级模块后不用强制刷新。
    location /apps/sharephotos/ {
        add_header Cache-Control "no-cache";
        try_files $uri /apps/sharephotos/index.html;
    }

    location /apps/sharephotos/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 分享页：/apps/sharephotos/s/<令牌> 都返回分享页，网关对这个前缀不要求登录。
    # 网址里带着令牌，不让搜索引擎收录，也不通过 Referer 带给别的网站。
    location /apps/sharephotos/s/ {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
        add_header Referrer-Policy "no-referrer";
        try_files $uri /apps/sharephotos/s/index.html;
    }

    location /apps/sharephotos/s/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
